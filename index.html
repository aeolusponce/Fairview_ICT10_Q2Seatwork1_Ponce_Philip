<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seatwork #2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            background-color: #4a3958;
        }

        .container {
            max-width: 600px;
            margin-top: 80px;
        }

        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="form-container">

            <h1 class="text-center mb-4">ICT Club Membership Checker</h1>

            <form id="checkForm">
                <div class="mb-3">
                    <label for="fname" class="form-label fw-semibold">
                        First Name
                    </label>
                    <input type="text" class="form-control"
                           id="fname" placeholder="First Name" required>
                </div>

                <div class="mb-3">
                    <label for="lname" class="form-label fw-semibold">
                        Last Name
                    </label>
                    <input type="text" class="form-control"
                           id="lname" placeholder="Last Name" required>
                </div>

                <button type="button" class="btn btn-primary w-100"
                        py-click="check_club">
                    Check Membership
                </button>
            </form>

            <p id="result" class="mt-3 text-center fw-semibold"></p>

        </div>
    </div>

    <script type="py">
from pyscript import document

club_members = [
    "philip ponce",
    "logan anaque",
    "francis fernandez",
    "edrian correa",
    "juan dela cruz"
]

def check_club(e):
    first_name = document.getElementById("fname").value.strip()
    last_name = document.getElementById("lname").value.strip()

    full_name = first_name + " " + last_name
    result = document.getElementById("result")

    message = {
        True: "Welcome " + full_name + "! You are an ICT Club member.",
        False: "Sorry " + full_name + ", your name is not on the list."
    }[full_name.lower() in club_members]

    result.innerText = message
    </script>

</body>
</html>
